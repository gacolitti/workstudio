services:
  shinyproxy:
    container_name: shinyproxy
    image: workstudio-shinyproxy
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
      - "./application.yml:/opt/shinyproxy/application.yml:z"
      - "./templates:/opt/shinyproxy/templates"
      - '${SSH_FOLDER_PATH}:/opt/shinyproxy/.ssh'  # Mount the .ssh folder
    networks: 
      - workstudio-net
    ports:
      - ${WORKSTUDIO_PORT}:8080
    env_file:
      .env
  # These images are built but will not create containers using docker-compose up by default
  rstudio:
    image: workstudio-rstudio
    build:
      context: rstudio
      dockerfile: Dockerfile
    scale: 0
  vscode:
    image: workstudio-vscode
    build:
      context: vscode
      dockerfile: Dockerfile
    scale: 0

networks: 
  workstudio-net:
    name: "workstudio-net"
      
